{% extends 'base.html' %}

{% block title %}Удаление{% endblock %}

{% block content %}
<h1 class="mb-4">Удаление</h1>

<p>Вы действительно хотите удалить объект?</p>

<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Удалить</button>
    <a href="{% url 'mailing:home' %}" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}
