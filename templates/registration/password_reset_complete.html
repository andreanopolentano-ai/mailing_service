{% extends "base.html" %}

{% block title %}Пароль восстановлен{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-body text-center">
                    <h1 class="h3 mb-3">
                        Пароль успешно изменён
                    </h1>

                    <p>
                        Новый пароль сохранён. Теперь вы можете
                        войти в свою учётную запись.
                    </p>

                    <a
                        href="{% url 'login' %}"
                        class="btn btn-primary"
                    >
                        Войти
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
